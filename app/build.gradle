plugins {
    id 'com.android.application'
}

def readBuildValue = { String name, String fallback ->
    def fromProperty = project.findProperty(name)
    def fromEnv = System.getenv(name)
    return (fromProperty ?: fromEnv ?: fallback).toString()
}

def asJavaString = { String value ->
    return '"' + (value ?: '')
            .replace('\\', '\\\\')
            .replace('"', '\\"') + '"'
}

android {
    namespace 'br.com.antonelly.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.antonelly.tv'
        minSdk 23
        targetSdk 35
        versionCode 10404
        versionName '1.4.4'

        // Esses valores podem ser injetados pelo GitHub Actions ou por -P no Gradle.
        // Se estiverem vazios, o app abre a tela de configuração normalmente.
        buildConfigField 'String', 'DEFAULT_SUPABASE_URL', asJavaString(readBuildValue('ATV_SUPABASE_URL', 'https://ahdiiucytddezjmcyzdo.supabase.co'))
        buildConfigField 'String', 'DEFAULT_PUBLISHABLE_KEY', asJavaString(readBuildValue('ATV_PUBLISHABLE_KEY', 'sb_publishable_XR80lQ8_YDwG2b62RnOBZQ_fZ_VCdfB'))
        buildConfigField 'String', 'DEFAULT_MEDIA_BUCKET', asJavaString(readBuildValue('ATV_MEDIA_BUCKET', 'tv-media'))
        buildConfigField 'String', 'DEFAULT_UPDATE_MANIFEST_URL', asJavaString(readBuildValue('ATV_UPDATE_MANIFEST_URL', ''))
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            def storePath = System.getenv('ATV_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('ATV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ATV_KEY_ALIAS')
                keyPassword System.getenv('ATV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (System.getenv('ATV_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    def media3_version = "1.6.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
}
